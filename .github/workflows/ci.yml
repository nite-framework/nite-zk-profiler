name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 24 runs the TypeScript tests directly through native type
      # stripping, so no loader or build step is needed before testing.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The Compact toolchain is not installed on the runner, so the
      # integration tests skip themselves and the unit tests still run.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify the published tarball contents
        run: npm pack --dry-run
