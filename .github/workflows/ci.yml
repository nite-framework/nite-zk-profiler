name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # The Compact toolchain is not installed on the runner, so the
      # integration tests skip themselves and the unit tests still run.
      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: Verify the published tarball contents
        run: bun pm pack --dry-run
