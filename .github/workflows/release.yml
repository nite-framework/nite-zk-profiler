name: Release

# Publishing is driven by the tag that `npm version` creates, so the npm
# release and the GitHub release always describe the same commit.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm provenance attestation

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so release notes can diff against the last tag

      # Deliberately no `registry-url`. Setting it makes setup-node write an
      # .npmrc containing `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`.
      # With trusted publishing there is no NODE_AUTH_TOKEN, so npm sends an
      # empty credential and never attempts the OIDC exchange. The registry
      # answers 404 on the PUT, which reads like a missing package but actually
      # means unauthenticated. npm defaults to registry.npmjs.org anyway.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Trusted publishing needs npm 11.5.1 or later. Node 24 already ships a
      # new enough npm, but pinning to latest keeps this from silently
      # regressing if the runner image moves backwards.
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - name: Preflight the publish identity
        run: |
          echo "npm $(npm --version)"
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "OIDC token endpoint present"
          else
            echo "NO OIDC token endpoint: id-token permission is missing"
            exit 1
          fi
          if [ -f .npmrc ] || [ -f "$HOME/.npmrc" ]; then
            echo "an .npmrc exists, which can shadow OIDC:"
            cat .npmrc "$HOME/.npmrc" 2>/dev/null | sed 's/=.*/=<redacted>/'
          else
            echo "no .npmrc, npm will use OIDC"
          fi

      - run: npm ci

      - name: Fail if the tag does not match package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi

      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # No NODE_AUTH_TOKEN. npm is configured to trust this repository and this
      # workflow file, and authenticates over OIDC using the id-token permission
      # granted above. Nothing secret is involved, and provenance comes from the
      # same identity.
      - name: Publish to npm
        run: npm publish --provenance --access public

      - name: Create the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
